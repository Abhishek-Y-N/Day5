<!DOCTYPE html>
<html>
<head>
    <title>Exercise 15f</title>
    <style>
        .div1
		{
            position: relative;
            display: inline-block;
        }

        .img
		{
            width: 500px;
        }

        .discount
		{
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: black;
            color: white;
            padding: 10px;
        }

        .bottom
		{
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 130px;
            background-color: rgba(255, 255, 255, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .btn
		{
            padding: 10px 25px;
            background-color: white;
            border: 1px solid black;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="div1">
        <img class="img" src="shirt.jpeg">
        <div class="discount">20% OFF</div>
        <div class="bottom">
            <button class="btn">Add to Cart</button>
        </div>
    </div>
</body>
</html>
