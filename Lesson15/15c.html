<!DOCTYPE html>
<html>
<head>
    <title>Exercise 15c</title>
    <style>
		.div1 
		{
		    position: fixed;
		    right: 20px;
		    bottom: 20px;
		    width: 320px;
		    height: 180px;
		    background-color: gray;
		}

		.close
		{
		    position: absolute;
		    top: -25px;
		    left: -25px;
		    width: 50px;
		    height: 50px;
		    border-radius: 50%;
		    background-color: black;
		    color: white;
		    font-size: 25px;
		    text-align: center;
		    line-height: 50px;
		}

    </style>
</head>
<body>
    <div class="div1">
        <div class="close">X</div>
    </div>
</body>
</html>
