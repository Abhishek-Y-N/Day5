<!DOCTYPE html>
<html>
<head>
    <title>Exercise 14e</title>
    <style>
        body
		{
            height: 3000px;
            margin: 0;
        }

        .main
		{
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            background-color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;

            padding-left: 170px;
            padding-right: 100px;

            box-shadow: 0px 1px 5px gray;
        }

        .div1
		{
            display: flex;
            align-items: center;
        }

        .img
		{
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
        }

        .txt
		{
            font-size: 20px;
            font-weight: bold;
            margin-left: 15px;
        }

        .div2
		{
            display: flex;
        }

        button
		{
            padding: 10px 20px;
            margin-left: 10px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
        }

        .add
		{
            background-color: #1877f2;
            color: white;
        }

    </style>
</head>
<body>
    <div class="main">
        <div class="div1">
            <img class="img" src="img.jpeg">
            <div class="txt">Oliver Cat</div>
        </div>

        <div class="div2">
            <button class="add">Add Friend</button>
            <button>Message</button>
        </div>
    </div>
</body>
</html>
