<!DOCTYPE html>
<html>
<head>
    <title>Exercise 13g</title>
    <style>
        .main
		{
            width: 600px;
            border: 1px;
			border: solid;
			border-color: lightgrey;
            padding: 15px;
        }

        .div1
		{
            display: flex;
        }

        .img
		{
            width: 55px;
            height: 55px;
            border-radius: 28px;
            object-fit: cover;
        }

        .div2
		{
            margin-left: 15px;
        }

        .div3
		{
            display: flex;
        }

        .name
		{
            font-weight: bold;
        }

        .user
		{
            color: gray;
            margin-left: 5px;
        }

        .txt
		{
            margin-top: 10px;
            font-size: 18px;
        }

        .box
		{
            display: flex;
            margin-top: 20px;
            border: 1px solid lightgray;
            border-radius: 15px;
            overflow: hidden;
        }

        .gray
		{
            width: 170px;
            height: 120px;
            background-color: lightgray;
        }

        .info
		{
            padding: 15px;
        }

        .site
		{
            color: gray;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>
    <div class="main">
        <div class="div1">
            <img class="img" src="img.jpeg">
            <div class="div2">

                <div class="div3">
                    <div class="name">supersimple.dev</div>
                    <div class="user">@SuperSimpleDev</div>
                </div>

                <div class="txt">What is backend web development? A complete overview. New video is up!</div>

                <div class="box">
                    <div class="gray"></div>

                    <div class="info">

                        <div class="site"> youtube.com</div>
                        <div> Backend web development - a complete overview (2021)</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
