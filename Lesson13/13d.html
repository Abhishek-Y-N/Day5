<!DOCTYPE html>
<html>
<head>
    <title>Exercise 13d</title>
    <style>
        .main
		{
            width: 550px;
            border: 1px solid lightgray;
            padding: 15px;
        }

        .top
		{
            color: gray;
            margin-bottom: 15px;
        }

        .div1
		{
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .img
		{
            width: 50px;
            height: 50px;
            border-radius: 120px;
            object-fit: cover;
        }

        .div2
		{
            flex: 1;
            margin-left: 15px;
        }

        .div3
		{
            display: flex;
            justify-content: space-between;
        }

        .txt 
		{
            font-weight: bold;
        }

        .time
		{
            color: gray;
        }

        .sub
		{
            font-weight: bold;
            margin-top: 5px;
        }

        .msg
		{
            color: gray;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="main">
        <div class="top">ALL INBOXES</div>
        <div class="div1">
            <img class="img" src="img.jpeg">
            <div class="div2">
                <div class="div3">
                    <div class="txt">Chewy Promotions</div>
                    <div class="time">4:58 PM</div>
                </div>
				
                <div class="sub"> Biggest sales of the year!</div>
                <div class="msg"> Hey there! We're writing to tell you about our...</div>
            </div>
        </div>
    </div>
</body>
</html>
